name: Build libRegRsp virion PHAR with DevTools
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: AxolotlBucketLabs/DevTools/.github/workflows/build-plugin.yml@latest
    with:
      type: virion
      phpstan: off
      php-version: '8.4'
      pm-version-major: '5'
      artifact-name: libRegRsp-virion-${{ github.sha }}

